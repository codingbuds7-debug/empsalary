<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Salary Management System</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dff6ff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            background-color: #0077b6;
            color: white;
            width: 900px;
            text-align: center;
            padding: 20px 0;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 400px;
            margin-bottom: 30px;
        }
        .form-container input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        .form-container button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .result {
            width: 900px;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .boxes {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .box {
            padding: 20px;
            color: #03045e;
            position: relative;
        }
        .details-box {
            background-color: #51afc2;
            width: 320px;
            height: 250px;
        }
        .breakdown-box {
            background-color: #ade8f4;
            width: 320px;
            height: 250px;
        }
        .final-box {
            background-color: #90e0ef;
            width: 400px;
            height: 120px;
            text-align: center;
            color: #023e8a;
        }
        .final-box h2 {
            margin: 0;
            padding-top: 30px;
            font-size: 20px;
        }
        .final-box p {
            margin: 0;
            font-size: 28px;
            color: green;
            font-weight: bold;
        }
        .label {
            font-weight: bold;
            margin-top: 10px;
        }
        .tax {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="title">EMPLOYEE SALARY MANAGEMENT SYSTEM</div>

    <div class="form-container" id="inputForm">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter Employee Name">
        <label>Basic Salary (₹):</label>
        <input type="number" id="basicSalary" placeholder="Enter Basic Salary">
        <label>Overtime Hours:</label>
        <input type="number" id="overtimeHours" placeholder="Enter Overtime Hours">
        <button onclick="calculate()">Show Salary</button>
    </div>

    <div class="result" id="resultSection">
        <div class="boxes">
            <div class="box details-box">
                <h3 style="margin-top:0;">Employee Details</h3>
                <p class="label" id="resName"></p>
                <p class="label" id="resBasic"></p>
                <p class="label" id="resOvertime"></p>
            </div>
            <div class="box breakdown-box">
                <h3 style="margin-top:0; text-align:center;">Salary Breakdown</h3>
                <p class="label" id="resOvertimePay"></p>
                <p class="label" id="resTotal"></p>
                <p class="tax" id="resTax"></p>
            </div>
        </div>
        <div class="final-box">
            <h2>Final Salary</h2>
            <p id="resFinal"></p>
        </div>
    </div>

    <script>
        function calculate() {
            const name = document.getElementById('name').value.trim();
            const basic = parseInt(document.getElementById('basicSalary').value, 10);
            const overtime = parseInt(document.getElementById('overtimeHours').value, 10);

            if (!name || isNaN(basic) || isNaN(overtime)) {
                alert('Please fill in all fields correctly.');
                return;
            }

            const overtimePay = overtime * 500;
            const totalSalary = basic + overtimePay;
            const taxRate = totalSalary > 50000 ? 0.10 : 0.05;
            const tax = totalSalary * taxRate;
            const finalSalary = totalSalary - tax;

            // Populate results
            document.getElementById('resName').textContent = `Name: ${name}`;
            document.getElementById('resBasic').textContent = `Basic Salary: ₹${basic}`;
            document.getElementById('resOvertime').textContent = `Overtime Hours: ${overtime}`;

            document.getElementById('resOvertimePay').textContent = `Overtime Pay: ₹${overtimePay}`;
            document.getElementById('resTotal').textContent = `Total Salary: ₹${totalSalary}`;

            const taxElem = document.getElementById('resTax');
            taxElem.textContent = `Tax Deducted: ₹${tax.toFixed(2)}`;
            taxElem.style.color = totalSalary > 50000 ? 'red' : 'orange';

            document.getElementById('resFinal').textContent = `₹ ${finalSalary.toFixed(2)}`;

            // Show result, hide form
            document.getElementById('inputForm').style.display = 'none';
            document.getElementById('resultSection').style.display = 'flex';
        }
    </script>
</body>
</html>
